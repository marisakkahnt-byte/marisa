<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Great+Vibes&family=DM+Sans:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0}
#b{width:1800px;padding:50px;box-sizing:border-box;background:#F4EFE7;font-family:'DM Sans'}
h1{margin:0 0 6px;text-align:center;font:400 56px 'DM Serif Display';letter-spacing:-.02em;color:#1F1D24}
.sub{text-align:center;font:600 13px 'DM Sans';letter-spacing:.3em;color:#0E4A38;margin-bottom:30px}
.row{display:flex;gap:26px;margin-bottom:26px}
.t{flex:1;height:520px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.t img{width:230px}
.lab{position:absolute;bottom:16px;font:600 12px 'DM Sans';letter-spacing:.24em;text-transform:uppercase;opacity:.6}
.a{font:400 74px/1 'DM Serif Display';letter-spacing:-.03em;margin-top:18px}
.b{font:400 104px/1 'Great Vibes';margin-top:-6px}
.c{font:italic 400 76px/1 'DM Serif Display';letter-spacing:-.02em;margin-top:16px}
.lockup{display:flex;flex-direction:column;align-items:center}
</style></head><body><div class="lockup-board" id="b">
<h1>gem M + “stitches”</h1><div class="sub">THREE LOCKUPS · ON BLACK AND ON WHITE</div>
<div class="row">
 <div class="t" style="background:#141214;color:#FBF9F6"><div class="lockup" data-n="lockup-A_black"><img src="GemM_transparent.png"><div class="a">stitches</div></div><span class="lab">A · your font (DM Serif)</span></div>
 <div class="t" style="background:#141214;color:#E2C27E"><div class="lockup" data-n="lockup-B_black"><img src="GemM_transparent.png"><div class="b">stitches</div></div><span class="lab" style="color:#FBF9F6">B · gold cursive</span></div>
 <div class="t" style="background:#141214;color:#F6D4E0"><div class="lockup" data-n="lockup-C_black"><img src="GemM_transparent.png"><div class="c">stitches</div></div><span class="lab" style="color:#FBF9F6">C · your font, italic blush</span></div>
</div>
<div class="row">
 <div class="t" style="background:#fff;color:#1F1D24"><div class="lockup" data-n="lockup-A_white"><img src="GemM_transparent.png"><div class="a">stitches</div></div><span class="lab">A · your font (DM Serif)</span></div>
 <div class="t" style="background:#fff;color:#B8914A"><div class="lockup" data-n="lockup-B_white"><img src="GemM_transparent.png"><div class="b">stitches</div></div><span class="lab">B · gold cursive</span></div>
 <div class="t" style="background:#fff;color:#0E4A38"><div class="lockup" data-n="lockup-C_white"><img src="GemM_transparent.png"><div class="c">stitches</div></div><span class="lab">C · your font, italic emerald</span></div>
</div></div></body></html>
