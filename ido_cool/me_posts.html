<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet"><style>
body{margin:0}.s{width:1080px;height:1350px;position:relative;overflow:hidden;background:#FBF7F0;display:flex;align-items:flex-start;justify-content:center;padding-top:50px}
.s img{width:930px;border-radius:18px}
.logo{position:absolute;right:56px;bottom:30px;font:400 46px 'Pinyon Script';color:#7E2E2C}
</style><!--brandmark--><script>window.addEventListener("DOMContentLoaded",()=>{document.querySelectorAll(".mark,.logo").forEach(m=>{if(!/I Do by Marisa/i.test(m.textContent))return;let el=m.parentElement,bg;while(el){const c=getComputedStyle(el).backgroundColor;if(c&&c!=="rgba(0, 0, 0, 0)"&&c!=="transparent"){bg=c;break}el=el.parentElement}const [r,g,b]=(bg||"rgb(251,247,240)").match(/[0-9.]+/g).map(Number);const dark=(0.299*r+0.587*g+0.114*b)<150;m.textContent="";const i=document.createElement("img");i.src="file:///home/user/marisa/ido_cool/_brand/"+(dark?"logo-blush-crop.png":"logo-charcoal-crop.png");i.style.cssText="height:104px;width:auto;display:block";m.appendChild(i);m.style.fontSize="0";m.style.lineHeight="0";m.style.textShadow="none";m.style.opacity="1"})})</script></head><body>
<section class="s" id="hello"><img src="headshot/headshot.jpg" style="width:900px;margin-top:40px"><div class="logo">I Do by Marisa</div></section>
<section class="s" id="loved"><img src="photos/me/officiant_07.jpg"><div class="logo">I Do by Marisa</div></section>
</body></html>
